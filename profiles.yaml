# Профили моделей (spec §9, ADR-010). Формат профиля — ModelProfile из contracts/.
# Этап получает профиль целиком в конфиге, поэтому смена модели или параметров меняет ключ кэша.
# prompt_version выбирает файлы prompts/<шаг>/<версия>.md.
#
# Профиль server-vllm выбирается в Compose. server и local работают с Ollama.
default: local
profiles:
  # Машина разработки: RTX 3060 12 ГБ, проверка механизма, а не качества (docs/benchmarks/).
  - name: local
    engine: ollama
    model: qwen3.5:9b
    weights_revision: sha256:dec52a44569a2a25341c4e4d3fee25846eed4f6f0b936278e3a3c900bb99d37c
    quantization: q4_K_M
    generation:
      temperature: 0.1
      reasoning: true
      max_tokens: 12000
      context_tokens: 32768
    prompt_version: v4
    stages: [facts, facts-review, summary, critic]

  # То же без рассуждения: в 10–13 раз быстрее на машине разработки. spec §6.7 требует
  # рассуждение на шаге А, поэтому профиль только для отладки цепочки.
  - name: local-fast
    engine: ollama
    model: qwen3.5:9b
    weights_revision: sha256:dec52a44569a2a25341c4e4d3fee25846eed4f6f0b936278e3a3c900bb99d37c
    quantization: q4_K_M
    generation:
      temperature: 0.1
      reasoning: false
      max_tokens: 6000
      context_tokens: 32768
    prompt_version: v4
    stages: [facts, facts-review, summary, critic]

  # Сервер: одна A100 40 ГБ, текст + изображения. Digest берется из локального манифеста.
  - name: server
    engine: ollama
    model: qwen3.5:27b
    weights_revision: local-manifest
    quantization: q4_K_M
    generation:
      temperature: 0.1
      reasoning: true
      max_tokens: 12000
      context_tokens: 32768
    prompt_version: v4
    stages: [facts, facts-review, summary, critic, vision, segmentation, recommendations]

  - name: server-vllm
    engine: vllm
    model: Qwen/Qwen3.5-27B
    weights_revision: hf:81a287ca484a5e71148f5beb7f367bb5286d70f9
    quantization: bf16
    generation:
      temperature: 0.1
      reasoning: true
      max_tokens: 12000
      context_tokens: 32768
    prompt_version: v4
    stages: [facts, facts-review, summary, critic, vision, segmentation, recommendations]

  - name: server-vllm-gptq
    engine: vllm
    model: Qwen/Qwen3.5-27B-GPTQ-Int4
    weights_revision: hf:8f0c09f227ae570e79617c6d9172b59df9c16081
    quantization: gptq-int4
    generation:
      temperature: 0.1
      reasoning: true
      max_tokens: 12000
      context_tokens: 32768
    prompt_version: v4
    stages: [facts, facts-review, summary, critic, vision, segmentation, recommendations]
