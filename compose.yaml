# Сервер приложений и локальные движки модели. Команды запуска — в Makefile.

name: rapporteur

x-ollama: &ollama
  # Образ закреплён по digest. В комплекте без интернета OLLAMA_IMAGE задаёт его тегом:
  # docker load может не сохранить digest, а целостность проверяет SHA256SUMS (docs/offline.md).
  image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.13@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429}
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  deploy:
    resources:
      limits:
        cpus: "${LLM_CPUS:-8}"
        memory: ${LLM_MEMORY:-64g}
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["${LLM_GPU_ID:-0}"]
            capabilities: [gpu]
  environment:
    HOME: /tmp
    OLLAMA_HOST: 0.0.0.0:11434
    OLLAMA_MODELS: /models
    OLLAMA_NO_CLOUD: "1"
    OLLAMA_NOPRUNE: "1"
    OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-32768}
    OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}

x-app: &app
  build:
    context: .
    target: app
  image: ${RAPPORTEUR_OLLAMA_APP_IMAGE:-rapporteur:local}
  restart: unless-stopped
  # Файлы в storage/ принадлежат пользователю, который запускает make.
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  ports:
    - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-18763}:8000"
  # Хранилище на хосте: база SQLite, оригиналы, кэш шагов, слайды, справки. Каталог создаёт
  # make; бэкап — копия каталога при остановленном приложении.
  volumes:
    - type: bind
      source: ${RAPPORTEUR_STORAGE:-./storage}
      target: /data
    - ${OLLAMA_MODELS_DIR:-./models/ollama}:/models/ollama:ro
  mem_limit: ${APP_MEMORY:-16g}
  cpus: ${APP_CPUS:-8}
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 10s

x-app-environment: &app-environment
  RAPPORTEUR_PROFILE: ${RAPPORTEUR_PROFILE:-server}
  OLLAMA_MODELS_PATH: /models/ollama
  RAPPORTEUR_INFERENCE_SLOTS: ${RAPPORTEUR_INFERENCE_SLOTS:-1}

services:
  app-vllm:
    <<: *app
    image: rapporteur:0.5.0
    profiles: [vllm, vllm-gptq-single, vllm-gptq-dual]
    environment:
      RAPPORTEUR_PROFILE: ${VLLM_APP_PROFILE:-server-vllm}
      VLLM_URL: ${VLLM_URL:-http://vllm:8000}
      VLLM_SECOND_URL: ${VLLM_SECOND_URL:-}
      RAPPORTEUR_INFERENCE_SLOTS: ${RAPPORTEUR_INFERENCE_SLOTS:-2}
    volumes:
      - type: bind
        source: ${RAPPORTEUR_STORAGE:-./storage}
        target: /data
    networks: [internal, edge]

  vllm: &vllm
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.32.0@sha256:6ee133356d49ed24cee03dd0cda3d3980279a11c107ce3e752c89e76540f41c9}
    platform: linux/amd64
    profiles: [vllm]
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    networks: [internal]
    shm_size: 2g
    environment:
      HOME: /tmp
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - type: bind
        source: ${VLLM_MODELS_DIR:-./models/vllm/qwen3.5-27b}
        target: /models/qwen
        read_only: true
        bind:
          create_host_path: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VLLM_GPU_ID_0:-0}", "${VLLM_GPU_ID_1:-1}"]
              capabilities: [gpu]
    command:
      - --model=/models/qwen
      - --served-model-name=Qwen/Qwen3.5-27B
      - --dtype=bfloat16
      - --tensor-parallel-size=2
      - --max-model-len=32768
      - --max-num-seqs=${RAPPORTEUR_INFERENCE_SLOTS:-2}
      - --reasoning-parser=qwen3
      - --generation-config=vllm
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

  vllm-gptq: &gptq
    <<: *vllm
    profiles: [vllm-gptq-single, vllm-gptq-dual]
    volumes:
      - type: bind
        source: ${VLLM_GPTQ_MODELS_DIR:-./models/vllm/qwen3.5-27b-gptq-int4}
        target: /models/qwen
        read_only: true
        bind:
          create_host_path: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VLLM_GPU_ID_0:-0}"]
              capabilities: [gpu]
    command:
      - --model=/models/qwen
      - --served-model-name=Qwen/Qwen3.5-27B-GPTQ-Int4
      - --dtype=bfloat16
      - --quantization=gptq_marlin
      - --tensor-parallel-size=1
      - --max-model-len=32768
      - --max-num-seqs=1
      - --reasoning-parser=qwen3
      - --generation-config=vllm

  vllm-gptq-second:
    <<: *gptq
    profiles: [vllm-gptq-dual]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VLLM_GPU_ID_1:-1}"]
              capabilities: [gpu]

  app:
    <<: *app
    environment:
      <<: *app-environment
      OLLAMA_URL: http://ollama:11434
    networks: [internal, edge]
    depends_on:
      ollama:
        condition: service_healthy

  # То же приложение с Ollama другого проекта вместо своей. Подключается к её сети Docker;
  # своя Ollama не запускается. Одновременно с app не запускать: у них общий порт и том.
  app-shared:
    <<: *app
    profiles: [shared-ollama]
    environment:
      <<: *app-environment
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    networks: [edge, shared, internal]

  # Ollama запущена на хосте. Веса и GPU остаются под управлением хоста.
  app-ollama-host:
    <<: *app
    profiles: [host-ollama]
    environment:
      RAPPORTEUR_PROFILE: ${RAPPORTEUR_PROFILE:-local}
      OLLAMA_URL: ${OLLAMA_HOST_URL:-http://host.docker.internal:11434}
    volumes:
      - type: bind
        source: ${RAPPORTEUR_STORAGE:-./storage}
        target: /data
    networks: [egress]

  # Модели лежат во внешнем каталоге OLLAMA_MODELS_DIR (blobs/ и manifests/) и подключаются
  # только на чтение (ADR-010). Ollama при старте переносит манифесты в manifests-v2, поэтому
  # манифесты (килобайты) копируются в память контейнера, а веса подключаются ссылкой.
  ollama:
    <<: *ollama
    restart: unless-stopped
    networks: [internal]
    volumes:
      - type: bind
        source: ${OLLAMA_MODELS_DIR:-./OLLAMA_MODELS_DIR-not-set}
        target: /models-source
        read_only: true
    tmpfs:
      - /models:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=0700
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        if [ ! -d /models-source/blobs ]; then
          echo "В OLLAMA_MODELS_DIR нет blobs/: укажите каталог с blobs и manifests" >&2
          exit 1
        fi
        ln -s /models-source/blobs /models/blobs
        for name in manifests manifests-v2; do
          if [ -d "/models-source/$$name" ]; then cp -R "/models-source/$$name" /models/; fi
        done
        exec ollama serve
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # Скачать модель в OLLAMA_MODELS_DIR на машине с интернетом: make pull MODEL=qwen3.5:9b.
  # Каталог должен быть доступен на запись пользователю HOST_UID.
  pull:
    <<: *ollama
    deploy: {}
    profiles: [tools]
    networks: [egress]
    volumes:
      - type: bind
        source: ${OLLAMA_MODELS_DIR:-./OLLAMA_MODELS_DIR-not-set}
        target: /models
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3; ollama pull \"$0\""]

  # Модели для комплекта без интернета: make bundle [MODEL="qwen3.5:9b …"].
  export-model:
    image: rapporteur:local
    profiles: [tools]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    network_mode: none
    volumes:
      - type: bind
        source: ${OLLAMA_MODELS_DIR:-./OLLAMA_MODELS_DIR-not-set}
        target: /models
        read_only: true
      - ./bundle/models:/out
    entrypoint: [python, -m, rapporteur.bundle, /models, /out]

  # Проверки Python: make check. Исходники с хоста, сети нет.
  dev:
    build:
      context: .
      target: dev
    image: rapporteur-dev:local
    profiles: [tools]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    network_mode: none
    volumes: [".:/app"]

  # Проверки и сборка фронтенда: make check.
  web-dev:
    build:
      context: .
      target: web-deps
    image: rapporteur-web-dev:local
    profiles: [tools]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    network_mode: none
    volumes: ["./frontend:/app/frontend"]

networks:
  internal:
    internal: true
  # Сеть Docker, в которой работает чужая Ollama (docker network ls); только для app-shared.
  shared:
    name: ${OLLAMA_NETWORK:-OLLAMA_NETWORK-not-set}
    external: true
  edge:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  egress: {}
