# Содержание сводки доклада (SummaryChecksConfig в src/rapporteur/summarize/checks.py).
# Настройки входят в ключ кэша сводки: после правки файла и пересборки образа (make up)
# доклады при следующей обработке получат новую сводку, прежние версии сохранятся.

# Число предложений основного текста; выводы автора идут отдельным блоком, до трёх.
min_sentences: 6
max_sentences: 10

# Порядок важности типов утверждений: conclusion — вывод автора, result — результат,
# method — метод и выполненные действия, problem — задача. Модель получает утверждения
# в этом порядке и в первую очередь отражает первые типы.
priorities: [conclusion, result, method, problem]

# Сколько утверждений типа сводка обязана использовать; если их меньше — все.
# Проверка кодом возвращает сводку модели с перечнем пропущенных утверждений.
required:
  conclusion: 3
  result: 3

# Сокращение в тексте сводки расшифровывается при первом упоминании по материалам доклада
# («система управления базами данных (СУБД)»); без расшифровки в материалах оно заменяется
# описанием. Общеизвестные сокращения и единицы не расшифровываются.
explain_abbreviations: true
known_abbreviations: [РФ, США, ЕС, СССР, ООН, СНГ, ВВП, СМИ, РАН, ИТ, IT, ИИ, КБ, МБ, ГБ, ТБ, ПБ, KB, MB, GB, TB]
